<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Offline — QR System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --accent: #0f766e;
            --accent-2: #115e59;
            --bg: #eef2f6;
            --surface: #ffffff;
            --font-body: "Source Sans 3", system-ui, sans-serif;
            --font-display: "IBM Plex Sans", system-ui, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: var(--font-body);
            color: var(--ink);
            background: var(--bg);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        }

        .offline-card {
            width: min(100%, 420px);
            background: var(--surface);
            border-radius: 16px;
            padding: 2rem 1.75rem;
            text-align: center;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
        }

        .offline-card__icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.25rem;
            border-radius: 18px;
            background: rgba(15, 118, 110, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }

        .offline-card__icon svg {
            width: 36px;
            height: 36px;
        }

        .offline-card h1 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0 0 0.5rem;
        }

        .offline-card p {
            margin: 0 0 1.5rem;
            color: var(--muted);
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .offline-card__status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8125rem;
            color: #b45309;
            background: rgba(180, 83, 9, 0.1);
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 1.25rem;
        }

        .offline-card__status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .offline-card__status.is-online {
            color: #15803d;
            background: rgba(21, 128, 61, 0.1);
        }

        .offline-card__btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 1.25rem;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .offline-card__btn:hover { background: var(--accent-2); }
        .offline-card__btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-card__icon" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M12 8v4m0 4h.01"/>
            </svg>
        </div>
        <div class="offline-card__status" id="connection-status" role="status">
            <span class="offline-card__status-dot"></span>
            <span id="connection-label">No internet connection</span>
        </div>
        <h1>You're currently offline</h1>
        <p>Please check your internet connection and try again.</p>
        <button type="button" class="offline-card__btn" id="retry-btn">Try again</button>
    </div>
    <script>
        (function () {
            var statusEl = document.getElementById('connection-status');
            var labelEl = document.getElementById('connection-label');
            var retryBtn = document.getElementById('retry-btn');

            function updateStatus() {
                var online = navigator.onLine;
                statusEl.classList.toggle('is-online', online);
                labelEl.textContent = online ? 'Connection restored' : 'No internet connection';
            }

            window.addEventListener('online', updateStatus);
            window.addEventListener('offline', updateStatus);
            updateStatus();

            retryBtn.addEventListener('click', function () {
                if (navigator.onLine) {
                    window.location.href = '/';
                } else {
                    retryBtn.textContent = 'Still offline…';
                    setTimeout(function () { retryBtn.textContent = 'Try again'; }, 1500);
                }
            });
        })();
    </script>
</body>
</html>
